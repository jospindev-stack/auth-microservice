name: CI

on:
  push:
    branches:
      - main
      - test/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AuthMicroservice.sln

      - name: Build
        run: dotnet build AuthMicroservice.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test AuthMicroservice.sln --configuration Release --no-build --verbosity normal
